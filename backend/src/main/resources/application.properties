spring.application.name=login-session-lab
server.address=127.0.0.1
server.port=${APP_PORT:8461}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55433/loginlab}
spring.datasource.username=${DATABASE_USER:loginlab}
spring.datasource.password=${DATABASE_PASSWORD:loginlab_dev}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.socketTimeout=3
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '2000ms'
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${REDIS_PORT:56380}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=300ms
spring.main.banner-mode=off
server.error.include-message=never
lab.enabled=${LAB_ENABLED:false}
lab.key=${LAB_KEY:disabled}
lab.instance=${APP_INSTANCE:A}
logging.level.root=WARN
logging.level.dev.portfolio.loginlab=INFO
